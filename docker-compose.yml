version: '3'

services:
  wind-watch:
    build:
      context: .
      dockerfile: Dockerfile
    networks:
      - airport_service_airport_internal  
    container_name: wind-watch
    volumes:
      - /var/www/html/pribiloftraffic/docker_data:/app/data
      - ./logs:/app/logs
      - ./stations.json:/app/config/stations.json
    restart: unless-stopped
    environment:
      - TZ=America/Anchorage
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "ls", "/app/logs"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s